<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frequently asked questions</title>
<style>

:root{
  --tu-marine:#003366;
  --tu-brons:#cc9933;
  --tu-ink:#1b1b1b;
  --tu-line:#d8dee6;
  --tu-soft:#eef2f7;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;
  color:var(--tu-ink);
  background:transparent;
  line-height:1.5;
  padding:4px;
}
.tu-wrap{max-width:900px;margin:0 auto;}
.tu-title{
  font-size:20px;line-height:1.3;color:var(--tu-marine);
  margin:0 0 4px;font-weight:bold;
}
.tu-intro{margin:0 0 16px;color:#41505f;font-size:15px;}
.tu-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
button{font-family:inherit;}


.acc-item{border:1px solid var(--tu-line);border-radius:6px;margin-bottom:8px;overflow:hidden;background:#fff;}
.acc-btn{width:100%;text-align:left;background:var(--tu-soft);border:0;padding:14px 44px 14px 16px;
  font-size:16px;font-weight:bold;color:var(--tu-marine);cursor:pointer;position:relative;}
.acc-btn:hover{background:#e2e9f2;}
.acc-btn:focus-visible{outline:3px solid var(--tu-brons);outline-offset:-3px;}
.acc-btn::after{content:"+";position:absolute;right:16px;top:50%;transform:translateY(-50%);
  font-size:22px;color:var(--tu-brons);line-height:1;}
.acc-btn[aria-expanded="true"]::after{content:"\2013";}
.acc-panel{display:none;padding:14px 16px;border-top:1px solid var(--tu-line);white-space:pre-wrap;}
.acc-item.open .acc-panel{display:block;}

</style>
</head>
<body>
<div class="tu-wrap">
<h2 class="tu-title">Frequently asked questions</h2><p class="tu-intro">Click a question to reveal the answer.</p>
<div class="acc">
  <div class="acc-item">
    <button class="acc-btn" type="button" aria-expanded="false" aria-controls="acc-p-0" id="acc-b-0">How do I hand in my assignment?</button>
    <div class="acc-panel" id="acc-p-0" role="region" aria-labelledby="acc-b-0">Use the Assignments section in Canvas and upload a PDF before the deadline.</div>
  </div>
  <div class="acc-item">
    <button class="acc-btn" type="button" aria-expanded="false" aria-controls="acc-p-1" id="acc-b-1">Can I resit the exam?</button>
    <div class="acc-panel" id="acc-p-1" role="region" aria-labelledby="acc-b-1">Yes. One resit is scheduled at the end of the block.</div>
  </div>
  <div class="acc-item">
    <button class="acc-btn" type="button" aria-expanded="false" aria-controls="acc-p-2" id="acc-b-2">Where do I find the reading list?</button>
    <div class="acc-panel" id="acc-p-2" role="region" aria-labelledby="acc-b-2">All literature is listed on the Course Information page.</div>
  </div>
</div>
</div>
<script>
(function(){

var btns = document.querySelectorAll('.acc-btn');
for (var i = 0; i < btns.length; i++) {
  btns[i].addEventListener('click', function () {
    var item = this.parentNode;
    var open = item.className.indexOf('open') > -1;
    item.className = open ? 'acc-item' : 'acc-item open';
    this.setAttribute('aria-expanded', open ? 'false' : 'true');
  });
}
})();
</script>
<script>
  function sendHeight() {
    var height = Math.max(
      document.body.scrollHeight,
      document.documentElement.scrollHeight,
      document.body.offsetHeight,
      document.documentElement.offsetHeight
    );
    try {
      if (window.frameElement) {
        window.frameElement.style.height = height + 'px';
      }
    } catch (e) { /* cross-origin parent */ }
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'cib-resize', height: height }, '*');
      }
    } catch (e) {}
  }
  window.addEventListener('load', sendHeight);
  window.addEventListener('resize', sendHeight);
  // Observe dynamic DOM changes (accordions, tabs, expansion)
  if ('ResizeObserver' in window) {
    new ResizeObserver(sendHeight).observe(document.body);
  }
  setTimeout(sendHeight, 300);
</script>
</body>
</html>
