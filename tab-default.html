<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course structure</title>
<style>

:root{
  --tu-marine:#003366;
  --tu-brons:#cc9933;
  --tu-ink:#1b1b1b;
  --tu-line:#d8dee6;
  --tu-soft:#eef2f7;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;
  color:var(--tu-ink);
  background:transparent;
  line-height:1.5;
  padding:4px;
}
.tu-wrap{max-width:900px;margin:0 auto;}
.tu-title{
  font-size:20px;line-height:1.3;color:var(--tu-marine);
  margin:0 0 4px;font-weight:bold;
}
.tu-intro{margin:0 0 16px;color:#41505f;font-size:15px;}
.tu-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
button{font-family:inherit;}


.tb-list{border-bottom:2px solid var(--tu-marine);margin:0 0 0;padding:0;}
.tb-btn{background:#eef2f7;border:1px solid var(--tu-line);border-bottom:0;border-radius:6px 6px 0 0;
  padding:10px 16px;font-size:15px;color:var(--tu-marine);cursor:pointer;margin-right:4px;}
.tb-btn[aria-selected="true"]{background:var(--tu-marine);color:#fff;font-weight:bold;border-color:var(--tu-marine);}
.tb-btn:focus-visible{outline:3px solid var(--tu-brons);outline-offset:2px;}
.tb-panel{display:none;border:1px solid var(--tu-line);border-top:0;padding:16px;background:#fff;
  border-radius:0 0 6px 6px;white-space:pre-wrap;}
.tb-panel.active{display:block;}

</style>
</head>
<body>
<div class="tu-wrap">
<h2 class="tu-title">Course structure</h2>
<div class="tb-list" role="tablist">
  <button class="tb-btn" type="button" role="tab" id="tb-b-0" aria-controls="tb-p-0" aria-selected="true">Week 1 Math</button>
  <button class="tb-btn" type="button" role="tab" id="tb-b-1" aria-controls="tb-p-1" aria-selected="false">Week 2</button>
  <button class="tb-btn" type="button" role="tab" id="tb-b-2" aria-controls="tb-p-2" aria-selected="false">Week 3</button>
</div>
<div class="tb-panel active" id="tb-p-0" role="tabpanel" aria-labelledby="tb-b-0">Introduction and course expectations. Read chapter 1.</div>
<div class="tb-panel" id="tb-p-1" role="tabpanel" aria-labelledby="tb-b-1">Research design. Workshop in the computer lab.</div>
<div class="tb-panel" id="tb-p-2" role="tabpanel" aria-labelledby="tb-b-2">Data analysis. Bring your own dataset.</div>
</div>
<script>
(function(){

var tbtns = document.querySelectorAll('.tb-btn');
var tpanels = document.querySelectorAll('.tb-panel');
for (var i = 0; i < tbtns.length; i++) {
  (function (idx) {
    tbtns[idx].addEventListener('click', function () {
      for (var j = 0; j < tbtns.length; j++) {
        tbtns[j].setAttribute('aria-selected', j === idx ? 'true' : 'false');
        tpanels[j].className = 'tb-panel' + (j === idx ? ' active' : '');
      }
    });
  })(i);
}
})();
</script>
<script>
  function sendHeight() {
    var height = Math.max(
      document.body.scrollHeight,
      document.documentElement.scrollHeight,
      document.body.offsetHeight,
      document.documentElement.offsetHeight
    );
    try {
      if (window.frameElement) {
        window.frameElement.style.height = height + 'px';
      }
    } catch (e) { /* cross-origin parent */ }
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'cib-resize', height: height }, '*');
      }
    } catch (e) {}
  }
  window.addEventListener('load', sendHeight);
  window.addEventListener('resize', sendHeight);
  // Observe dynamic DOM changes (accordions, tabs, expansion)
  if ('ResizeObserver' in window) {
    new ResizeObserver(sendHeight).observe(document.body);
  }
  setTimeout(sendHeight, 300);
</script>
</body>
</html>
